meta:
  yal-min-version: "0.1.3"
  exclude:
    - "package-lock.json"
    - "dist"
    - "node_modules"

actions:
  post:
    - cmd: git init --initial-branch=main
    - cmd: npm i
    - cmd: code "{project_path}"

fields:
  - id: "package-name"
    type: "text"
    required: true
    default: "{placeholder}"
  - id: "folder-name"
    type: "text"
    required: true
    default: "{placeholder}"
    is-folder-name: true
  - id: "user-name"
    type: "text"
    default: "<!USER-NAME>"

messages:
  package-name:
    prompt: "Enter package name"
    placeholder: "my-package"
  folder-name:
    prompt: "Enter folder/repo name"
    placeholder: "my-package"
  user-name:
    prompt: "Enter GitHub username"

  ru:
    package-name:
      prompt: "Введите имя пакета"
      placeholder: "my-package"
    folder-name:
      prompt: "Введите имя папки/репозитория"
      placeholder: "my-package"
    user-name:
      prompt: "Введите имя пользователя GitHub"

targets:
  - file: "/package.json"
    format: "json"
    fields:
      - field: "package-name"
        key: "name"
      - value: "git+https://github.com/{user-name}/{folder-name}.git"
        key: "repository.url"
      - value: "https://github.com/{user-name}/{folder-name}/issues"
        key: "bugs.url"
      - value: "https://github.com/{user-name}/{folder-name}#readme"
        key: "homepage"
